name: Build iOS IPA (搜索+分类增强版)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '分支名称'
        required: true
        default: 'master'
        type: string
  push:
    branches:
      - master
      - merge-search-yan

env:
  FLUTTER_VERSION: "3.41.x"

jobs:
  build-ios:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}
          fetch-depth: 1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Restore packages
        run: |
          cd simple_live_app
          flutter pub get

      - name: Build iOS
        run: |
          cd simple_live_app
          flutter build ios --release --no-codesign

      - name: Create unsigned IPA
        run: |
          cd simple_live_app
          mkdir -p build/ios/iphoneos/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/Runner.app
          cd build/ios/iphoneos/
          zip -q -r ios_search_enhanced.ipa Payload
          cd ../../..

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-search-enhanced
          path: simple_live_app/build/ios/iphoneos/ios_search_enhanced.ipa
          retention-days: 7

      - name: Done
        run: echo "Build completed: ${{ job.status }}"
